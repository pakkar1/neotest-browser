name: Build dan rilis Neotest
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            asset: Neotest-windows-x86_64.exe
            options: --windowed
          - os: ubuntu-22.04
            asset: Neotest-linux-x86_64
            options: ''
          - os: macos-15
            asset: Neotest-macos-arm64
            options: ''
          - os: macos-15-intel
            asset: Neotest-macos-x86_64
            options: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Periksa versi tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python -c 'import neotest, os; tag=os.environ["GITHUB_REF_NAME"]; assert tag == "v" + neotest.APP_VERSION, f"Tag {tag} harus sama dengan v{neotest.APP_VERSION}"'
      - name: Instal dependensi Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libnss3 libdbus-1-3
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Build binary
        shell: bash
        run: python -m PyInstaller --noconfirm --clean --onefile ${{ matrix.options }} --name Neotest neotest.py
      - name: Siapkan aset
        shell: bash
        run: |
          mkdir -p release
          if [ "$RUNNER_OS" = Windows ]; then cp dist/Neotest.exe "release/${{ matrix.asset }}"; else cp dist/Neotest "release/${{ matrix.asset }}"; fi
          # Aset alias untuk updater CakBro 3.1/3.2 yang mencari nama lama.
          legacy="${{ matrix.asset }}"
          legacy="CakBro-${legacy#Neotest-}"
          cp "release/${{ matrix.asset }}" "release/$legacy"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Buat checksum seluruh platform
        run: cd release && sha256sum Neotest-* CakBro-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: true
